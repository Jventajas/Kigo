# Full model and training config for the 124M Kigo model on FineWeb-Edu.
# This config is shared between training and inference so the architecture
# always matches the checkpoint.

# --- Paths ---
data_dir: data/fineweb-edu
checkpoint_dir: checkpoints

# --- Tokenizer ---
tokenizer_name: unsloth/Llama-4-Scout-17B-16E-Instruct-unsloth-bnb-4bit

# --- Model architecture ---
vocab_size: 202048
n_layer: 12
n_head: 12
d_model: 768
d_ff: 2048
block_size: 1024
dropout: 0.0
bias: False

# --- RoPE ---
rope_base: 10000.0
rope_max_length: 2048

batch_size: 8
global_batch_size: 512
max_steps: 8000
learning_rate: 0.0006
min_lr: 0.00006
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0
checkpoint_interval: 500
eval_interval: 500
log_interval: 10
sample_interval: 2000

# --- Inference defaults ---
temperature: 0.8
top_k: 40
max_new_tokens: 256
