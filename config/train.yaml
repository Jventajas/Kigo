# Full training config for 124M model on FineWeb-Edu.
data_dir: data/fineweb-edu
batch_size: 8
global_batch_size: 512
max_steps: 4000
learning_rate: 0.0006
min_lr: 0.00006
warmup_steps: 2000
weight_decay: 0.1
grad_clip: 1.0
checkpoint_interval: 500
eval_interval: 1000
log_interval: 10
sample_interval: 2000
