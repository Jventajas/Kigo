# Tiny config for local iteration on CPU / small GPU.

# --- Tokenizer ---
tokenizer_backend: huggingface
tokenizer_name: HuggingFaceTB/SmolLM2-135M

# --- Model architecture ---
vocab_size: 49152
n_layer: 2
n_head: 2
d_model: 128
d_ff: 256
block_size: 128
dropout: 0.0
bias: False

# --- RoPE ---
rope_base: 10000.0
rope_max_length: 2048

# --- Training ---
batch_size: 4
global_batch_size: 512
max_epochs: 4
learning_rate: 0.0006
min_lr: 0.00006
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0
checkpoint_interval: 500
eval_interval: 0.001
log_interval: 10
sample_interval: 2000

# --- Inference defaults ---
temperature: 0.8
top_k: 40
max_new_tokens: 256
