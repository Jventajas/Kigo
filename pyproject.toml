[project]
name = "kigo"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "tiktoken>=0.7.0",
    "torch>=2.12.0",
    "tqdm>=4.68.2",
    "transformers>=4.51.0",
    "wandb>=0.27.2",
    "lightning>=2.6.5",
    "kaggle>=2.2.2",
]

[dependency-groups]
dev = [
    "lightning-sdk>=2026.6.8.post0",
    "pyright>=1.1.410",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nn", "optimizers"]
include = ["*.py"]

[tool.pyright]
exclude = ["**/__pycache__", ".venv", "wandb", "data", "checkpoints"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"
# Lenient at the library boundary: torch/lightning/transformers ship patchy stubs,
# so silence "unknown type" noise from their return values and untyped bases/
# decorators while keeping the strict checks on our own annotations.
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportUntypedBaseClass = false
reportUntypedFunctionDecorator = false
reportConstantRedefinition = false
